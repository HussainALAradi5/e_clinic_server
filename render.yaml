# Render Blueprint — e-Clinic demo on free instances: the Laravel API (Docker), the Angular client (static site)
# and Postgres. New → Blueprint → this repository; Render asks only for the values marked `sync: false`.
databases:
  - name: e-clinic-db
    plan: free
    region: frankfurt
    databaseName: e_clinic
    user: e_clinic
    postgresMajorVersion: "17"

services:
  - type: web
    name: e-clinic-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: e-Clinic
      # A demo deployment: seeded demo accounts and their fixed two-factor code (see DEMO_USERS.md).
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: BLIND_INDEX_KEY
        generateValue: true
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      # The free instance (0.1 CPU) needs about an hour for the demo seed, so the demo database is seeded on a
      # developer machine with this service's APP_KEY / BLIND_INDEX_KEY and restored. "true" seeds here instead.
      - key: SEED_ON_EMPTY
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: e-clinic-db
          property: connectionString
      - key: CLIENT_URL
        fromService:
          type: web
          name: e-clinic-web
          property: host
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: MAIL_MAILER
        value: log
      - key: LOG_LEVEL
        value: warning

  - type: web
    name: e-clinic-web
    runtime: static
    repo: https://github.com/HussainALAradi5/e_clinic_client
    branch: master
    buildCommand: npm ci && npm run build:deploy
    staticPublishPath: dist/e_clinic_client/browser
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        fromService:
          type: web
          name: e-clinic-api
          property: host
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
